[project]
name = "agent-builder"
version = "0.1.0"
description = "A builder that compiles, tests, optimizes and selects agents for unseen tasks (Freya Build the Builder)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tau = []

[project.scripts]
builder = "builder.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/builder"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["src/builder/schema", "src/builder/optimize", "src/builder/llm"]

[tool.ruff.lint.per-file-ignores]
# Node-code libraries are concatenated into one snippet; names cross files.
"builder/fb/nodecode/negotiation_lib.py" = ["F821", "RUF005"]
# Sandbox code: plain constructs the code_exec runtime surely supports.
"builder/fb/nodecode/*.py" = ["SIM102", "UP031"]
# Dev tools print long diagnostic lines.
"builder/tools/*.py" = ["E501", "SIM105", "RUF005"]
"builder/build.py" = ["SIM105"]
"builder/fb/generate.py" = ["E501"]
"tests/hack/spec_fixtures.py" = ["E501"]
